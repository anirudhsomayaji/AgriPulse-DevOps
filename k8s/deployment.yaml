
apiVersion: apps/v1
kind: Deployment

metadata:
  name: agripulse-deployment
  labels:
    app: agripulse

spec:
  replicas: 3

  selector:
    matchLabels:
      app: agripulse

  template:
    metadata:
      labels:
        app: agripulse

    spec:
      containers:
        - name: agripulse
          image: agripulse:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
              protocol: TCP

          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
